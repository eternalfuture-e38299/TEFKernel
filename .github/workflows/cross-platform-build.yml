name: Cross-Platform Build

on:
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [debug, release]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake make
        
      - name: Configure
        run: cmake --preset ci-linux-x86_64-${{ matrix.build_type }}
        
      - name: Build
        run: cmake --build --preset ci-linux-x86_64-${{ matrix.build_type }}
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-${{ matrix.build_type }}
          path: build/ci-linux-x86_64-${{ matrix.build_type }}/

  linux-x86:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [debug, release]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake make gcc-multilib g++-multilib
        
      - name: Configure
        run: cmake --preset ci-linux-x86-${{ matrix.build_type }}
        
      - name: Build
        run: cmake --build --preset ci-linux-x86-${{ matrix.build_type }}
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86-${{ matrix.build_type }}
          path: build/ci-linux-x86-${{ matrix.build_type }}/

  windows-x86_64:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [debug, release]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: choco install cmake mingw -y
        
      - name: Configure
        run: cmake --preset ci-windows-x86_64-${{ matrix.build_type }}
        
      - name: Build
        run: cmake --build --preset ci-windows-x86_64-${{ matrix.build_type }}
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-${{ matrix.build_type }}
          path: build/ci-windows-x86_64-${{ matrix.build_type }}/

  windows-x86:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [debug, release]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: choco install cmake mingw -y
        
      - name: Configure
        run: cmake --preset ci-windows-x86-${{ matrix.build_type }}
        
      - name: Build
        run: cmake --build --preset ci-windows-x86-${{ matrix.build_type }}
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86-${{ matrix.build_type }}
          path: build/ci-windows-x86-${{ matrix.build_type }}/

  macos-x86_64:
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [debug, release]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: brew install cmake make
        
      - name: Configure
        run: cmake --preset ci-macos-x86_64-${{ matrix.build_type }}
        
      - name: Build
        run: cmake --build --preset ci-macos-x86_64-${{ matrix.build_type }}
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-${{ matrix.build_type }}
          path: build/ci-macos-x86_64-${{ matrix.build_type }}/

  macos-arm64:
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [debug, release]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: brew install cmake make
        
      - name: Configure
        run: cmake --preset ci-macos-arm64-${{ matrix.build_type }}
        
      - name: Build
        run: cmake --build --preset ci-macos-arm64-${{ matrix.build_type }}
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-${{ matrix.build_type }}
          path: build/ci-macos-arm64-${{ matrix.build_type }}/

  android-arm64:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [debug, release]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          
      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
        
      - name: Configure
        run: cmake --preset ci-android-arm64-${{ matrix.build_type }}
        
      - name: Build
        run: cmake --build --preset ci-android-arm64-${{ matrix.build_type }}
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-${{ matrix.build_type }}
          path: build/ci-android-arm64-${{ matrix.build_type }}/

  android-arm32:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [debug, release]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          
      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
        
      - name: Configure
        run: cmake --preset ci-android-arm32-${{ matrix.build_type }}
        
      - name: Build
        run: cmake --build --preset ci-android-arm32-${{ matrix.build_type }}
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm32-${{ matrix.build_type }}
          path: build/ci-android-arm32-${{ matrix.build_type }}/
